CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=7
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_BT_DEVICE_NAME="8REC-KM"
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_REBOOT=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_HOGP=y
CONFIG_BT_ATT_TX_COUNT=12
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_PRIVACY=n
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_GATT_DM_MAX_ATTRS=128
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_BT_L2CAP_TX_BUF_COUNT=20
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=3
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=n
CONFIG_BT_HOGP_REPORTS_MAX=16
CONFIG_BT_FILTER_ACCEPT_LIST=y

# HID peripheral for the computers
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_BAS=y
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REP_MAX=3
CONFIG_BT_HIDS_OUTPUT_REP_MAX=1
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_ATTR_MAX=40
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=5
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=64
CONFIG_BT_GATT_CHRC_POOL_SIZE=32
CONFIG_BT_CONN_CTX=y
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="DIY"
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0xEEEF
CONFIG_BT_DIS_PNP_VER=0x0100

# second identity: the computers see their own address, the MX devices keep the first
CONFIG_BT_ID_MAX=3
CONFIG_BT_EXT_ADV=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# controller link budget: two input devices (central) and two computers (peripheral)
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=5

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y
CONFIG_RESET_ON_FATAL_ERROR=y

# configuration service (Web Bluetooth page): long values need a bigger ATT MTU, and a second advertising set
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3


# NFC tag (coil on the NFC pads): tapping a phone opens the setup page and the setup window
CONFIG_NFC_T2T_NRFXLIB=y
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_URI_MSG=y
CONFIG_NFC_NDEF_URI_REC=y
CONFIG_NFC_PLATFORM=y
CONFIG_NRFX_NFCT=y
CONFIG_BT_BONDABLE_PER_CONNECTION=y

# radio time: every link used to reserve 7.5 ms per event, which seven links cannot share (computer links timed out or lost their
# update instant, reasons 0x08 and 0x28, and the pointer arrived in lumps). Reports are tiny: 2.5 ms per link is plenty.
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=2500
CONFIG_BT_CTLR_SDC_CENTRAL_ACL_EVENT_SPACING_DEFAULT=2500
